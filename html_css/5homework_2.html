<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      font-family:Arial;
      text-align:center;
      margin-bottom:5px;
      margin-top:0;
    }
    .new{
      font-size:12px;
      color:rgb(255, 153, 0);
      
    }
    .MacBook{
      font-size:19px;
      font-weight:bold;
      
    }
    .pros{
      font-size:28px;
      font-weight:bold;
    }
    .price{
      font-size:14px;
    }
    .buy{
      background-color:rgb(0, 81, 255);
      color:white;
      padding:7px 12px;
      font-weight:bold;
      border:none;
      border-radius:14px;
      cursor:pointer;
    }


  </style>
</head>
<body>
  <p class="new">New</p>
  <p class="MacBook">MacBook Pro</p>
  <p class="pros">Supercharged for pros.</p>
  <p class="price">From $1999</p>
  <button class="buy">Buy</button>
</body>
</html>
