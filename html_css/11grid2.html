<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div style="display:grid;
  grid-template-columns: 200px 75px;
  margin-bottom: 30px;">
    <div style="background-color: aqua;">200px</div>
    <div style="background-color: rgb(241, 7, 171);">75px</div>
  </div>


  <div style="display:grid;
  grid-template-columns: 50px 1fr 75px;
  margin-bottom: 30px;">
    <div style="background-color: aqua;">50px</div>
    <div style="background-color: rgb(241, 7, 171);">1fr</div>
    <div style="background-color: aqua;">75px</div>
  </div>


  <div style="display:grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  margin-bottom: 30px;
  column-gap: 20px;
  row-gap: 10px;">
    <div style="background-color: aqua;">1fr</div>
    <div style="background-color: rgb(241, 7, 171);">1fr</div>
    <div style="background-color: aqua;">1fr</div>
    <div style="background-color: rgb(241, 7, 171);">1fr</div>
    <div style="background-color: aqua;">1fr</div>
    <div style="background-color: rgb(241, 7, 171);">1fr</div>
    <div style="background-color: aqua;">1fr</div>
    
    <div style="background-color: rgb(241, 7, 171);">1fr</div>
  </div>
</body>
</html>
