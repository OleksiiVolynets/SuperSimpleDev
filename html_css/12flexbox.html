<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Practise</title>
</head>
<body style="padding-bottom: 1000px;">
  <div style="display:flex;
  flex-direction:row;
  margin-bottom: 30px;">
    <div style="background-color: aqua;">div1 text </div>
    <div style="background-color: rgb(255, 0, 191);">div2 <p>paragraph</p></div>
  </div>


   <div style="display:flex;
    flex-direction:row">
    <div style="background-color: aqua; width:100px;">100px </div>
    <div style="background-color: rgb(255, 0, 191);
    flex:1;">div2 <p>flex1</p></div>
  </div>


  <div style="display:flex;
    flex-direction:row;
    margin-top:30px;">
    <div style="background-color: aqua; width:100px;">100px </div>
    <div style="background-color: rgb(255, 0, 191);
    flex:1;">flex1</div>
    <div style="background-color: rgb(0, 255, 191);
    flex:2;">flex2</div>
  </div>

  <div style="display:flex;
    height:70px;
    border:1px solid black;
    flex-direction:row;
    margin-top:30px;
    justify-content: center;
    ">
    <div style="background-color: aqua; width:100px;">100px </div>
    <div style="background-color: rgb(255, 0, 191);
     width:100px;">100px</div>
    <div style="background-color: rgb(0, 255, 191);
     width:100px;">100px</div>
  </div>



  <div style="display:flex;
    height:70px;
    border:1px solid black;
    flex-direction:row;
    margin-top:30px;
    justify-content: space-between;
    ">
    <div style="background-color: aqua; width:100px;">100px </div>
    <div style="background-color: rgb(255, 0, 191);
     width:100px;">100px</div>
    <div style="background-color: rgb(0, 255, 191);
     width:100px;">100px</div>
  </div>

  <div style="display:flex;
    height:70px;
    border:1px solid black;
    flex-direction:row;
    margin-top:30px;
    justify-content: space-between;
    align-items: center;
    ">
    <div style="background-color: aqua; width:100px;">100px </div>
    <div style="background-color: rgb(255, 0, 191);
     width:100px;">100px</div>
    <div style="background-color: rgb(0, 255, 191);
     width:100px;">100px</div>
  </div>
</body>
</html>
