<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Position Practise</title>
</head>
<body style="padding-top:60px;padding-left:90px; height:1000px;">
  <div style="background-color:black ;color:white;position:fixed;top:0px;left:0px;height:50px;right:0px; z-index:1;">
    Header
  </div>

  <div style="background-color: lightgray;width:200px;height:100%;position:fixed;top:50px;left:0px; bottom:0px;width:80px;">
    Sidebar
    <div style="background-color: red;color:white;position:absolute;right:0px;top:0px;">X</div>
  </div>

  <div style="background-color: red;color:white;position:absolute;right:10px;top:100px;">
    Absolute
  </div>

  <div style="background-color: aqua;height:200px;width:200px;
  ">
  div1
</div>

  <div style="background-color: lightcoral;height:200px;width:200px;position:relative;">
    div2
    <div style="background-color: red;color:white;position:absolute;right:5px;bottom:5px;">
    Absolute
  </div>
  </div>
</body>
</html>
