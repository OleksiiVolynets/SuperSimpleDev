<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid practise</title>
</head>
<body style="padding-bottom: 1000px;">
  <div style="
    display:grid;
    grid-template-columns: 100px 100px;">
    <div style="background-color: aqua;">div1</div>
    <div style="background-color: rgb(255, 0, 200);">div2
      <p>Text</p>
    </div>
  </div>

  <div style="
    margin-top:40px;
    display:grid;
    grid-template-columns: 100px 100px 200px;">
    <div style="background-color: aqua;">100px</div>
    <div style="background-color: rgb(255, 0, 200);">100px
      <p>Text</p>
    </div>
    <div style="background-color: rgb(247, 206, 24);">
      200px
    </div>
    <div style="background-color: rgb(0, 47, 255);">
      100px
    </div>
  </div>

  <div style="
    margin-top:40px;
    display:grid;
    grid-template-columns: 100px 1fr;">
    <div style="background-color: aqua;">div1</div>
    <div style="background-color: rgb(255, 0, 200);">div2 1fr
      
    </div>
  </div>

  <div style="
    margin-top:40px;
    display:grid;
    grid-template-columns: 100px 1fr 1fr;">
    <div style="background-color: aqua;">div1</div>
    <div style="background-color: rgb(255, 0, 200);">div2</div>
     <div style="background-color: rgb(0, 140, 255);">div3</div>
  </div>
  <div style="
    margin-top:40px;
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    height:200px;
    margin-bottom: 20px;
    column-gap: 20px;
    row-gap:20px;">
    <div style="background-color: aqua;">div1</div>
    <div style="background-color: rgb(255, 0, 200);">div2</div>
    <div style="background-color: rgb(0, 140, 255);">div3</div>
    <div style="background-color: rgb(255, 0, 200);">div4</div>
    <div style="background-color: rgb(0, 140, 255);">div5</div>
    <div style="background-color: aqua;">div6</div>
  </div>
</body>
</html>
