<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
  .subscribe{
    background-color: rgb(201, 0, 0);
    color:white;
    border:none;
    height:36px;
    width:110px;
    border-radius: 2px;
    cursor:pointer;
    margin:0px 10px 0px 0px;
    transition: opacity 0.3s;

  }
  .subscribe:hover{
    opacity:0.8;
  }
  .subscribe:active{
    opacity:0.4;
  }
  .join{
    background-color: white;
    color:rgb(6,95,212);
    height:36px;
    width:75px;
    border-radius: 2px;
    border: 1px solid rgb(6,95,212);
    cursor:pointer;
    margin:0px 10px 0px 0px;
    transition: background-color 0.3s, color 0.3s;
  }
  .join:hover{
    background-color:rgb(6,95,212);
    color:white;
  }
  .join:active{
    opacity:0.7;
  }
  .tweet{
    background-color:rgb(29, 161, 242);
    color:white;
    height:36px;
    width:75px;
    border-radius: 18px;
    border:none;
    cursor:pointer;
    font-weight:bold;
    transition : box-shadow 0.3s;
  }
  .tweet:hover{
    box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    
  }
  .tweet:active{
    opacity:0.7;
  }
  

</style>
</head>
<body>
 

<button class="subscribe">SUBSCIBE</button>
<button class="join">JOIN</button>
<button class="tweet">Tweet</button>
</body>
</html>
