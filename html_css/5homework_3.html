<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    p{
      font-family:Arial;
      margin-top:0;
      margin-bottom:5px;
    }
    .price{
      font-size:30px
    }
    .usd{
      font-size:15px;
      color:grey;
    }
    .today{
      color:rgb(2, 165, 2)
    }
    .after{
      color:grey;
    }
    .minus{
      color:rgb(218, 2, 2)
    }



  </style>
</head>
<body>
  <p class="price">1,049.61 <span class="usd">USD</span></p>
  <p class="today">+18.05(1.75%) today</p>
  <p class="after">After hours 1,048.00 <span class="minus">-1.61(0.15%)</span></p>
</body>
</html>
