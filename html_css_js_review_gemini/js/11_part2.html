<body>
  
  <script>
    const myArray=['Chicken', 'Rice', 'Cola', 'Salad', 'Cola', 'Apple'];
    function removeItem(array,word){
      let newArray=[]
      for(let i=0;i<array.length;i++){
        if(array[i]!==word){
          newArray.push(array[i])
        }
      }
      return newArray;
    }
    console.log(removeItem(myArray,'Cola'))


  </script>
</body>
