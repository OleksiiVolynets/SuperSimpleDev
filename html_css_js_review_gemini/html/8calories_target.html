<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Limit</title>
  <link rel="stylesheet" href="../css/8calories_target.css">
</head>
<body>
  <div class="overlay">
    <div class="daily-goal">
      <img src="img/gym.jpg" alt="Alex" class="photo">
      <div class="title">Daily Routine Limit</div>
      <div class="macro-inputs">
        <div class="macros-item">
          <div class="macros-item-label protein-label">Protein Target</div>
          <input type="text" class="macros-input" placeholder="Enter protein">
        </div>
        <div class="macros-item">
          <div class="macros-item-label carbs-label">Carbs Target</div>
          <input type="text" class="macros-input" placeholder="Enter carbs">
        </div>
        <div class="macros-item">
          <div class="macros-item-label fats-label">Fats Target</div>
          <input type="text" class="macros-input" placeholder="Enter Fats">
        </div>
        
      </div>
      <input type="text" class="daily-limit-input" placeholder="Daily Calorie Limit">
      <div class="btn-flexbox">
        <button class="daily-goal-btn save-btn">Save & Start</button>
        <button class="daily-goal-btn skip-btn">Skip for now</button>
      </div>
    </div>
  </div>
</body>
</html>
