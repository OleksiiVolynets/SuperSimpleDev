<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .cart-button{
      background-color:rgb(223, 207, 68);

      color:black;
      padding:5px 40px;
      padding:none;
      border-radius:20px;
      border:none;
      font-size:18px;
      cursor:pointer;
    }
    .request-button{
      padding:15px 18px;
      color:white;
      background-color:black;
      font-size:18px;
      border:none;
      margin-right:7px;
      border-radius:7px;
      font-weight:bold;
    }
    .schedule-button{
      background-color:rgb(156, 155, 155);
      color:black;
      font-size:18px;
      padding:15px 18px;
      border:none;
      border-radius:7px;
      font-weight:bold;
    }

  </style>
</head>
<body>
  <button class="cart-button">Add to Cart</button>
  <p>
    <button class="request-button second-class">Request now</button>
    <button class="schedule-button">Schedule for later</button>
  </p>
  <button class="js-button">Test</button>


  <script>
    console.log(document.querySelector(".js-button").classList.contains("js-button"))
  </script>
  
</body>
</html>
