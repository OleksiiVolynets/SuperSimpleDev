<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="12style.css">
</head>
<body>
  <h1>Rock Paper Scissors</h1>

  <button class="element js-rock-button" >
    <img src="images/rock-emoji.png" alt="Rock" class="emoji">
  </button>

  <button class="element js-paper-button">
    <img src="images/paper-emoji.png" alt="Paper" class="emoji">
  </button>

  <button  class="element js-scissors-button">
    <img src="images/scissors-emoji.png" alt="Rock" class="emoji">
  </button>

  <p class="who-win"></p>
  <p class="Choice"></p>
  <p class="score"></p>
  <button class="reset_button js-reset-button">Reset scores</button>
  <button class="reset_button js-auto-play">Autoplay</button>
  <p class="js-considering-paragraph"></p>

<script src="12script.js"></script>
</body>
</html>
