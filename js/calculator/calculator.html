<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="calculator.css">
</head>
<body>
  <p class="js-display"></p>
  <p>
    <button class="number" onclick="updateCalculation(1)">1</button>
    <button class="number" onclick="updateCalculation(2)">2</button>
    <button class="number" onclick="updateCalculation(3)">3</button>
    <button class="number operation" onclick="updateCalculation(' + ')">+</button>
  </p>
  <p>
    <button class="number" onclick="updateCalculation(4)">4</button>
    <button class="number" onclick="updateCalculation(5)">5</button>
    <button class="number" onclick="updateCalculation(6)">6</button>
    <button class="number operation" onclick="updateCalculation(' - ')">-</button>
  </p>
  <p>
    <button class="number" onclick="updateCalculation(7)">7</button>
    <button class="number" onclick="updateCalculation(8)">8</button>
    <button class="number" onclick="updateCalculation(9)">9</button>
    <button class="number operation" onclick="updateCalculation(' * ')">*</button>
  </p>
  <p>
    <button class="number" onclick="updateCalculation(0)">0</button>
    <button class="number" onclick="updateCalculation('.')">.</button>
    <button class="number" onclick="Equal()">=</button>
    <button class="number operation" onclick="updateCalculation(' / ')">/</button>
  </p>
  <button class="number clear" onclick="Clear()">Clear</button>
  

 

  <script>
    let calculation=localStorage.getItem('key1')||""
    const paragraph=document.querySelector('.js-display');
    paragraph.innerHTML=calculation||''
    function updateCalculation(param){
      calculation+=param
      localStorage.setItem('key1',calculation)
      displayCalculation()
      
    }
    function Clear(){
      calculation='';
      localStorage.removeItem('key1')
      displayCalculation()
      
    }
    function Equal(){
      calculation=eval(calculation);
      localStorage.setItem('key1',calculation)
      displayCalculation()
    }
    function displayCalculation(){
      paragraph.innerHTML=calculation
    }
  </script>
</body>
</html>
