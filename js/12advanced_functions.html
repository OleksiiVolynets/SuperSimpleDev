<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced functions</title>
</head>
<body>
  


  <script>
    function greeting(){
      console.log('hello')
    }
    greeting();

    const numb=2;
    const func1=function(){
      console.log('hello2')
    };
    console.log(func1);
    console.log(typeof func1);


    const object1={
      num:2,
      fun(){
        console.log('hello3')
      }

    };
    object1.fun();

    function display(param){
      console.log(param)
    };
    display(2);
    function run(param){
      param()
    }
    run(function(){
      console.log('hello4')
    });


    //setTimeout

    setTimeout(function(){
      console.log('timeout')
    },3000);

    console.log('next line')


    setInterval(function(){
      console.log('interval')
    },3000);

    ['make dinner','wash dishes','watch youtube'].forEach(function(value,index){
      if(value==='wash dishes'){
        return;
      }
      console.log(index);
      console.log(value);
    })









    

  </script>
</body>
</html>
