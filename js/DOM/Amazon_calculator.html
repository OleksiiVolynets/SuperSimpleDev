<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    p{
      font-family:Arial;
      font-size:20px;
    }
    .calculate-button{
      color:white;
      background-color: rgb(4, 161, 4);
      padding:10px;
      cursor:pointer;
      border:none;
      font-family:Arial;
      font-size:16px;
    }
    .input-price{
      height:32px;
      padding-left:12px;
      margin-right:7px;
      width:180px;
    }
    .flexbox{
      display:flex;
      align-items: center;
    }
    .display-price{
      color:red;
    }
  </style>
</head>
<body>
  <p>Amazon Shipping Calculator</p>
  <p>Orders under $40=+$10 shipping</p>
  <p>Orders over $40=FREE shipping</p>

  <div class="flexbox">
    <input type="text" placeholder="Cost of order" class="input-price" onkeydown="costKeyDown(event)">
    <button class="calculate-button" onclick="displayPrice()">Calculate</button>
  </div>
  
  <p class="display-price"></p>


  <script>
    const message=document.querySelector('.display-price');
    function costKeyDown(event){
      if(event.key==='Enter'){
      displayPrice()
    }
    }
    function displayPrice(){
      let number=Number(document.querySelector('.input-price').value)
      message.classList.remove('display-price')
      if(number<0){
        message.classList.add('display-price')
        message.innerHTML=`Error:The price can't be less than 0`
      }
      else if(number>=40){
        message.innerHTML=`$${number}`
      }
      else{
        number=(number*100+10*100)/100;
        message.innerHTML=`$${number}`
      }
    }
  </script>
</body>
</html>
