<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    
    .js-gaming,.js-music,.js-tech{
      padding:12px 15px;
      font-size:18px;
      color:black;
      font-family:Arial;
      background-color: rgb(177, 176, 176);
      border:none;
      border-radius:4px;
    }
    .black-button{
      color:white;
      background-color:black;
    }

    
  </style>
</head>
<body>
  
  <button class="js-gaming" onclick="changeColor(this)">Gaming</button>
  <button class="js-music" onclick="changeColor(this)">Music</button>
  <button class="js-tech" onclick="changeColor(this)">Tech</button>




  <script>

    function changeColor(but){
      if(but.classList.contains('black-button')){
        but.classList.remove('black-button')
      }
      else{
      turnOFButton();
      but.classList.add('black-button')

      }
    }
    function turnOFButton(){
      const buttonON=document.querySelector('.black-button');
      if(buttonON){
        buttonON.classList.remove('black-button')
      }

    }
  </script>
</body>
</html>
