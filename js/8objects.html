<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  



  <script>
    const product={
      name:'socks',
      price:1000
    }
    console.log(product);
    console.log(product.name)
    console.log(product.price)
    //change
    product.name='cotton';
    console.log(product);
    //add property
    product.newproperty=true;
    console.log(product);
    //delete
    delete product.name;
    console.log(product)


    const product2={
      name:'shirt',
      'delivery-time':'1 day',
      rating:{
        stars:4.5,
        count:87
      },
      fun: function function1(){
        console.log('function inside object')
      }
    }
    console.log(product2)
    //second option to show a key
    console.log(product2['name'])
    console.log(product2['delivery-time'])

    console.log(product2.rating.stars);
    console.log(product2.fun())


    //json
    console.log(JSON.stringify(product2));
    const jsonString=JSON.stringify(product2)
    console.log(JSON.parse(jsonString))

    //other methods
    console.log('hello'.length)
    console.log('hello'.toUpperCase());

    const object1={
      message:'hello'
    };
    const object2=object1;
    object1.message='Good job';
    console.log(object1)
    console.log(object2)
    const object3={
      message:'Good job'
    }
    console.log(object1===object3)//false
    console.log(object1===object2)//true
    const object4={
      message:'Good job',
      price:7.99
    }
    //shortcut if we have variable the same name and the property
    // const message=object4.message;
    const{message,price}=object4;
    console.log(message);
    console.log(price);

    const a=10;
    const object5={
      //message:message
      message,
      a,
      // method:function function1(){
      //   console.log('method')
      // }
      method(){
        console.log('method')
      }
    }
    console.log(object5)
    console.log(object5.method())


  </script>
</body>
</html>
