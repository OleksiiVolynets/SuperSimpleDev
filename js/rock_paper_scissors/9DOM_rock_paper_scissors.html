<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Rock Paper Scissors</h1>

  <button onclick="playGame('rock')" class="element">
    <img src="rock-emoji.png" alt="Rock" class="emoji">
  </button>

  <button onclick="playGame('paper')" class="element">
    <img src="paper-emoji.png" alt="Paper" class="emoji">
  </button>

  <button onclick="playGame('scissors')" class="element">
    <img src="scissors-emoji.png" alt="Rock" class="emoji">
  </button>

  <p class="who-win"></p>
  <p class="Choice"></p>
  <p class="score"></p>
  <button onclick="resetScore()" class="reset_button">Reset scores</button>

  <script>
    let score=JSON.parse(localStorage.getItem('score'))
    ||{
        wins:0,
        losses:0,
        ties:0
      }
      let scoreParagraph=document.querySelector('.score');
      scoreParagraph.innerHTML=`Wins: ${score.wins} Losses: ${score.losses} Ties: ${score.ties}`
      let computerPic=''
    

    function resetScore(){
      score.wins=0;
      score.losses=0;
      score.ties=0;
      localStorage.removeItem('score');
      scoreParagraph.innerHTML=`Wins: ${score.wins} Losses: ${score.losses} Ties: ${score.ties}`
    }
    function pickComputerMove(){
      const computerChoice = Math.random();
      let computerMove = '';
      if (computerChoice >=0 && computerChoice <= 1/3) {
        
        computerMove='rock';
        computerPic=`<img src="rock-emoji.png" alt="Rock" class="emoji">`
      } 
      else if (computerChoice >1/3 && computerChoice <= 2/3) {
        
        computerMove='paper';
        computerPic=`<img src="paper-emoji.png" alt="Rock" class="emoji">`
      } 
      else {
        computerMove='scissors';
        computerPic=`<img src="scissors-emoji.png" alt="Rock" class="emoji">`
      }

      return computerMove;
    }

    function playGame(playerMove){
      const computerMove=pickComputerMove();
      let whoWin=document.querySelector('.who-win')
      let ourChoice=document.querySelector('.Choice');
      let result='';
      if (playerMove==='scissors'){
        if (computerMove === 'rock') {
          result='You lose.';
        } else if (computerMove === 'paper') {
          result='You win.';
        } else {
          result='Tie.';
        }
        playerMove=`<img src="scissors-emoji.png" alt="Rock" class="emoji">`
      }
      else if (playerMove==='paper'){
        if (computerMove === 'rock') {
          result='You win.';
        } else if (computerMove === 'paper') {
          result='Tie.';
        } else {
          result='You lose.';
        }
        playerMove=`<img src="paper-emoji.png" alt="Rock" class="emoji">`
      }
      else if(playerMove==='rock'){
        if (computerMove === 'rock') {
          result='Tie.';
        } else if (computerMove === 'paper') {
          result='You lose.';
        } else {
          result='You win.';
        }
        playerMove=`<img src="rock-emoji.png" alt="Rock" class="emoji">`
      }
      if(result==='You win.'){
        score.wins++
      }
      else if(result==='You lose.'){
        score.losses++
      }
      else{
        score.ties++
      }
      whoWin.innerHTML=result;
      ourChoice.innerHTML=`You:${playerMove} Computer:${computerPic}`
      scoreParagraph.innerHTML=`Wins: ${score.wins} Losses: ${score.losses} Ties: ${score.ties}`
      localStorage.setItem('score',JSON.stringify(score));
      
      // alert(`You chose: ${playerMove}. Computer chose: ${computerMove}. ${result} Wins: ${score.wins} Losses: ${score.losses} Ties: ${score.ties}`);
    }

  </script>
</body>
</html>
